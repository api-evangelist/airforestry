aid: airforestry
name: Airforestry
description: 'AirForestry is a Swedish climate-technology company developing autonomous
  electric drones that perform forest thinning from the air. Its system pairs AI and
  computer vision for tree identification and selection with a lightweight aerial harvesting
  tool, letting a fleet of drones fell and extract trees without ground machinery.
  The result is forestry with zero soil compaction, no root damage and no machine tracks,
  higher operational efficiency, and lower emissions than conventional harvesters, while
  increasing forest growth and carbon sequestration. The company was surfaced as a
  portfolio company of Northzone and added to the API Evangelist network. It currently
  publishes a marketing and news presence but no public developer, API, or documentation
  surface.'
